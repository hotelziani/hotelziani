<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - Résidence Ziani</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gold: #D4AF37;
            --dark-navy: #0A192F;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0A192F 0%, #1A3A52 100%);
            color: white;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: white;
            text-decoration: none;
            margin-bottom: 2rem;
            padding: 0.8rem 1.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-5px);
        }

        .booking-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--primary-gold);
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        label i {
            color: var(--primary-gold);
        }

        input, select, textarea {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-gold);
            background: rgba(255, 255, 255, 0.1);
        }

        select option {
            background: var(--dark-navy);
            color: white;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .price-summary {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(212, 175, 55, 0.05));
            border: 2px solid var(--primary-gold);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .price-row:last-child {
            border: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .price-label {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .price-value {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--primary-gold);
        }

        .total-price {
            font-size: 2rem;
            font-weight: 700;
        }

        .submit-btn {
            width: 100%;
            padding: 1.2rem;
            background: var(--primary-gold);
            color: var(--dark-navy);
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 1rem;
            border-radius: 15px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert.success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid rgba(40, 167, 69, 0.5);
            color: #4ade80;
        }

        .alert.error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.5);
            color: #f87171;
        }

        .alert.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-prompt {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.3);
            border-radius: 20px;
            margin-bottom: 2rem;
        }

        .login-prompt a {
            color: var(--primary-gold);
            text-decoration: none;
            font-weight: 600;
        }

        .login-prompt a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .booking-card {
                padding: 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            <span data-i18n="nav_home">الرئيسية</span>
        </a>

        <div class="booking-card">
            <h1 data-i18n="booking_title">احجز إقامتك</h1>

            <div id="alertBox" class="alert"></div>
            
            <div id="loginPrompt" class="login-prompt" style="display: none;">
                <p>
                    <i class="fas fa-info-circle"></i>
                    يرجى <a href="login.html" data-i18n="nav_login">تسجيل الدخول</a> أو 
                    <a href="register.html" data-i18n="nav_register">إنشاء حساب</a> للمتابعة
                </p>
            </div>

            <form id="bookingForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>
                            <i class="fas fa-bed"></i>
                            <span data-i18n="booking_roomtype">نوع الغرفة</span>
                        </label>
                        <select id="roomType" required>
                            <option value="">اختر نوع الغرفة</option>
                            <option value="studio" data-i18n="room_studio">ستوديو</option>
                            <option value="one_bedroom" data-i18n="room_onebedroom">غرفة نوم واحدة</option>
                            <option value="family" data-i18n="room_family">عائلية</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>
                            <i class="fas fa-users"></i>
                            <span data-i18n="booking_guests">عدد الضيوف</span>
                        </label>
                        <input type="number" id="guests" min="1" max="6" value="2" required>
                    </div>

                    <div class="form-group">
                        <label>
                            <i class="fas fa-calendar-check"></i>
                            <span data-i18n="booking_checkin">تاريخ الدخول</span>
                        </label>
                        <input type="date" id="checkIn" required>
                    </div>

                    <div class="form-group">
                        <label>
                            <i class="fas fa-calendar-times"></i>
                            <span data-i18n="booking_checkout">تاريخ الخروج</span>
                        </label>
                        <input type="date" id="checkOut" required>
                    </div>

                    <div class="form-group">
                        <label>
                            <i class="fas fa-user"></i>
                            <span data-i18n="booking_fullname">الاسم الكامل</span>
                        </label>
                        <input type="text" id="fullName" required>
                    </div>

                    <div class="form-group">
                        <label>
                            <i class="fas fa-envelope"></i>
                            <span data-i18n="booking_email">البريد الإلكتروني</span>
                        </label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group full-width">
                        <label>
                            <i class="fas fa-phone"></i>
                            <span data-i18n="booking_phone">رقم الهاتف</span>
                        </label>
                        <input type="tel" id="phone" required>
                    </div>

                    <div class="form-group full-width">
                        <label>
                            <i class="fas fa-comment"></i>
                            <span data-i18n="booking_special">طلبات خاصة (اختياري)</span>
                        </label>
                        <textarea id="specialRequests" data-i18n-placeholder="booking_special"></textarea>
                    </div>
                </div>

                <div class="price-summary" id="priceSummary" style="display: none;">
                    <div class="price-row">
                        <span class="price-label" data-i18n="booking_nights">عدد الليالي</span>
                        <span class="price-value" id="nightsCount">0</span>
                    </div>
                    <div class="price-row">
                        <span class="price-label">سعر الليلة</span>
                        <span class="price-value" id="nightlyRate">0 DZD</span>
                    </div>
                    <div class="price-row">
                        <span class="price-label" data-i18n="booking_total">المبلغ الإجمالي</span>
                        <span class="price-value total-price" id="totalPrice">0 DZD</span>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <i class="fas fa-check-circle"></i>
                    <span data-i18n="booking_submit">تأكيد الحجز</span>
                </button>
            </form>
        </div>
    </div>

    <script src="translations.js"></script>
    <script src="supabase.js"></script>
    
    <script>
        let currentUser = null;
        let roomPrices = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            // Check if user is logged in
            currentUser = await ResidenceZiani.Auth.getCurrentUser();
            
            if (!currentUser) {
                document.getElementById('loginPrompt').style.display = 'block';
                document.getElementById('bookingForm').style.opacity = '0.5';
                document.getElementById('submitBtn').disabled = true;
            }

            // Load room prices
            roomPrices = await ResidenceZiani.RoomSettings.getPrices();

            // Set minimum date to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('checkIn').min = today;
            document.getElementById('checkOut').min = today;

            // Check for pre-selected room type
            const urlParams = new URLSearchParams(window.location.search);
            const selectedRoom = urlParams.get('room');
            if (selectedRoom) {
                document.getElementById('roomType').value = selectedRoom;
            }

            // Pre-fill user data if logged in
            if (currentUser) {
                document.getElementById('email').value = currentUser.email;
                if (currentUser.user_metadata?.full_name) {
                    document.getElementById('fullName').value = currentUser.user_metadata.full_name;
                }
            }

            // Add event listeners
            setupEventListeners();
            updatePriceSummary();
        });

        function setupEventListeners() {
            const form = document.getElementById('bookingForm');
            const roomType = document.getElementById('roomType');
            const checkIn = document.getElementById('checkIn');
            const checkOut = document.getElementById('checkOut');

            // Update price on any change
            [roomType, checkIn, checkOut].forEach(element => {
                element.addEventListener('change', updatePriceSummary);
            });

            // Validate dates
            checkIn.addEventListener('change', () => {
                checkOut.min = checkIn.value;
                if (checkOut.value && checkOut.value < checkIn.value) {
                    checkOut.value = '';
                }
            });

            // Form submission
            form.addEventListener('submit', handleSubmit);
        }

        function updatePriceSummary() {
            const roomType = document.getElementById('roomType').value;
            const checkIn = document.getElementById('checkIn').value;
            const checkOut = document.getElementById('checkOut').value;

            if (!roomType || !checkIn || !checkOut || !roomPrices) {
                document.getElementById('priceSummary').style.display = 'none';
                return;
            }

            // Calculate nights
            const nights = ResidenceZiani.Utils.calculateNights(checkIn, checkOut);
            
            if (nights <= 0) {
                document.getElementById('priceSummary').style.display = 'none';
                return;
            }

            // Get price for selected room type
            let nightlyRate = 0;
            switch(roomType) {
                case 'studio':
                    nightlyRate = roomPrices.studio_price;
                    break;
                case 'one_bedroom':
                    nightlyRate = roomPrices.one_bedroom_price;
                    break;
                case 'family':
                    nightlyRate = roomPrices.family_price;
                    break;
            }

            // Calculate total
            const totalPrice = nightlyRate * nights;

            // Update UI
            document.getElementById('nightsCount').textContent = nights;
            document.getElementById('nightlyRate').textContent = nightlyRate.toLocaleString('fr-DZ') + ' DZD';
            document.getElementById('totalPrice').textContent = totalPrice.toLocaleString('fr-DZ') + ' DZD';
            document.getElementById('priceSummary').style.display = 'block';
        }

        async function handleSubmit(e) {
            e.preventDefault();

            if (!currentUser) {
                showAlert('error', 'يرجى تسجيل الدخول أولاً');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span data-i18n="booking_processing">جاري المعالجة...</span>';

            // Collect form data
            const formData = {
                userId: currentUser.id,
                roomType: document.getElementById('roomType').value,
                checkIn: document.getElementById('checkIn').value,
                checkOut: document.getElementById('checkOut').value,
                guests: parseInt(document.getElementById('guests').value),
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                specialRequests: document.getElementById('specialRequests').value,
                totalPrice: calculateTotalPrice()
            };

            // Validate
            if (!validateBooking(formData)) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> <span data-i18n="booking_submit">تأكيد الحجز</span>';
                return;
            }

            // Create booking
            const result = await ResidenceZiani.Bookings.create(formData);

            if (result.success) {
                showAlert('success', langManager.t('msg_booking_success'));
                
                // Redirect to payment or profile after 2 seconds
                setTimeout(() => {
                    window.location.href = 'profile.html';
                }, 2000);
            } else {
                showAlert('error', result.error || langManager.t('msg_error'));
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> <span data-i18n="booking_submit">تأكيد الحجز</span>';
            }
        }

        function validateBooking(data) {
            const checkIn = new Date(data.checkIn);
            const checkOut = new Date(data.checkOut);
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            if (checkIn < today) {
                showAlert('error', 'تاريخ الدخول يجب أن يكون في المستقبل');
                return false;
            }

            if (checkOut <= checkIn) {
                showAlert('error', langManager.t('msg_invalid_dates'));
                return false;
            }

            // Validate guests count based on room type
            const maxGuests = {
                studio: 2,
                one_bedroom: 4,
                family: 6
            };

            if (data.guests > maxGuests[data.roomType]) {
                showAlert('error', `عدد الضيوف يتجاوز السعة القصوى للغرفة (${maxGuests[data.roomType]} أشخاص)`);
                return false;
            }

            return true;
        }

        function calculateTotalPrice() {
            const roomType = document.getElementById('roomType').value;
            const checkIn = document.getElementById('checkIn').value;
            const checkOut = document.getElementById('checkOut').value;
            
            const nights = ResidenceZiani.Utils.calculateNights(checkIn, checkOut);
            
            let nightlyRate = 0;
            switch(roomType) {
                case 'studio':
                    nightlyRate = roomPrices.studio_price;
                    break;
                case 'one_bedroom':
                    nightlyRate = roomPrices.one_bedroom_price;
                    break;
                case 'family':
                    nightlyRate = roomPrices.family_price;
                    break;
            }

            return nightlyRate * nights;
        }

        function showAlert(type, message) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert ${type} show`;
            alertBox.textContent = message;

            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 5000);
        }
    </script>
</body>
</html>
