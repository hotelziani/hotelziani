<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Résidence Ziani</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gold: #D4AF37;
            --dark-navy: #0A192F;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0A192F 0%, #1A3A52 100%);
            color: white;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: white;
            text-decoration: none;
            padding: 0.8rem 1.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .logout-btn {
            padding: 0.8rem 1.5rem;
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.5);
            color: #f87171;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
        }

        .logout-btn:hover {
            background: rgba(220, 53, 69, 0.3);
        }

        .profile-header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 3rem;
            margin-bottom: 3rem;
            text-align: center;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--primary-gold), #F4D03F);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 3rem;
            color: var(--dark-navy);
        }

        .profile-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--primary-gold);
            margin-bottom: 0.5rem;
        }

        .profile-email {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--primary-gold);
            margin-bottom: 2rem;
        }

        .bookings-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 3rem;
        }

        .booking-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .booking-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .booking-id {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary-gold);
        }

        .booking-status {
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(255, 193, 7, 0.5);
        }

        .status-paid {
            background: rgba(40, 167, 69, 0.2);
            color: #4ade80;
            border: 1px solid rgba(40, 167, 69, 0.5);
        }

        .status-cancelled {
            background: rgba(220, 53, 69, 0.2);
            color: #f87171;
            border: 1px solid rgba(220, 53, 69, 0.5);
        }

        .booking-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .booking-detail {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .detail-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .detail-value {
            color: white;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .booking-actions {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-cancel {
            padding: 0.8rem 1.5rem;
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.5);
            color: #f87171;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .btn-cancel:hover {
            background: rgba(220, 53, 69, 0.3);
        }

        .btn-cancel:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .empty-state i {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            color: var(--primary-gold);
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .empty-state a {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 1rem 2rem;
            background: var(--primary-gold);
            color: var(--dark-navy);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .empty-state a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .profile-header,
            .bookings-container {
                padding: 2rem;
            }

            .booking-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                <span data-i18n="nav_home">الرئيسية</span>
            </a>

            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span data-i18n="nav_logout">تسجيل الخروج</span>
            </button>
        </div>

        <div class="profile-header">
            <div class="profile-avatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="profile-name" id="userName">Loading...</div>
            <div class="profile-email" id="userEmail">Loading...</div>
        </div>

        <div class="bookings-container">
            <h2 data-i18n="profile_mybookings">حجوزاتي</h2>
            <div id="bookingsList">
                <!-- Bookings will be loaded here -->
            </div>
        </div>
    </div>

    <script src="translations.js"></script>
    <script src="supabase.js"></script>
    
    <script>
        let currentUser = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            // Check authentication
            currentUser = await ResidenceZiani.Auth.getCurrentUser();
            
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            // Load user info
            loadUserInfo();

            // Load bookings
            await loadBookings();
        });

        function loadUserInfo() {
            const userName = document.getElementById('userName');
            const userEmail = document.getElementById('userEmail');

            const displayName = currentUser.user_metadata?.full_name || 
                               currentUser.email.split('@')[0];

            userName.textContent = displayName;
            userEmail.textContent = currentUser.email;
        }

        async function loadBookings() {
            const bookingsList = document.getElementById('bookingsList');
            
            // Show loading
            bookingsList.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i></div>';

            // Fetch bookings
            const bookings = await ResidenceZiani.Bookings.getUserBookings(currentUser.id);

            if (bookings.length === 0) {
                bookingsList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-calendar-times"></i>
                        <h3 data-i18n="profile_nobookings">${langManager.t('profile_nobookings')}</h3>
                        <p>ابدأ حجزك الأول الآن</p>
                        <a href="booking.html" data-i18n="nav_booking">${langManager.t('nav_booking')}</a>
                    </div>
                `;
                return;
            }

            // Render bookings
            bookingsList.innerHTML = bookings.map(booking => {
                const statusClass = `status-${booking.payment_status}`;
                const statusText = langManager.t(`status_${booking.payment_status}`);
                const canCancel = booking.payment_status === 'pending';

                return `
                    <div class="booking-card">
                        <div class="booking-header">
                            <div class="booking-id">
                                <span data-i18n="profile_booking_id">${langManager.t('profile_booking_id')}</span>: #${booking.id}
                            </div>
                            <div class="booking-status ${statusClass}">
                                ${statusText}
                            </div>
                        </div>

                        <div class="booking-details">
                            <div class="booking-detail">
                                <span class="detail-label" data-i18n="profile_room">${langManager.t('profile_room')}</span>
                                <span class="detail-value">${getRoomName(booking.room_type)}</span>
                            </div>

                            <div class="booking-detail">
                                <span class="detail-label" data-i18n="booking_checkin">${langManager.t('booking_checkin')}</span>
                                <span class="detail-value">${formatDate(booking.check_in)}</span>
                            </div>

                            <div class="booking-detail">
                                <span class="detail-label" data-i18n="booking_checkout">${langManager.t('booking_checkout')}</span>
                                <span class="detail-value">${formatDate(booking.check_out)}</span>
                            </div>

                            <div class="booking-detail">
                                <span class="detail-label" data-i18n="booking_guests">${langManager.t('booking_guests')}</span>
                                <span class="detail-value">${booking.guests}</span>
                            </div>

                            <div class="booking-detail">
                                <span class="detail-label" data-i18n="profile_total">${langManager.t('profile_total')}</span>
                                <span class="detail-value">${booking.total_price.toLocaleString('fr-DZ')} DZD</span>
                            </div>
                        </div>

                        ${canCancel ? `
                            <div class="booking-actions">
                                <button class="btn-cancel" onclick="cancelBooking(${booking.id})">
                                    <i class="fas fa-times"></i>
                                    <span data-i18n="profile_cancel">${langManager.t('profile_cancel')}</span>
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function getRoomName(roomType) {
            const typeMap = {
                'studio': langManager.t('room_studio'),
                'one_bedroom': langManager.t('room_onebedroom'),
                'family': langManager.t('room_family')
            };
            return typeMap[roomType] || roomType;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('ar-DZ', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        async function cancelBooking(bookingId) {
            if (!confirm('هل أنت متأكد من إلغاء هذا الحجز؟')) {
                return;
            }

            const result = await ResidenceZiani.Bookings.cancel(bookingId);

            if (result.success) {
                alert('تم إلغاء الحجز بنجاح');
                await loadBookings();
            } else {
                alert('حدث خطأ أثناء إلغاء الحجز');
            }
        }

        async function logout() {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                await ResidenceZiani.Auth.signOut();
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
