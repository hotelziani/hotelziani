<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Résidence Ziani</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gold: #D4AF37;
            --dark-navy: #0A192F;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0A192F 0%, #1A3A52 100%);
            color: white;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: white;
            text-decoration: none;
            padding: 0.8rem 1.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--primary-gold);
            text-align: center;
            margin-bottom: 3rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }

        .stat-icon {
            font-size: 3rem;
            color: var(--primary-gold);
            margin-bottom: 1rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.7);
        }

        .section {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 3rem;
            margin-bottom: 3rem;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--primary-gold);
            margin-bottom: 2rem;
        }

        .price-settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .price-group {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
        }

        .price-group h3 {
            color: var(--primary-gold);
            margin-bottom: 1rem;
        }

        .input-group {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        input[type="number"] {
            flex: 1;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-gold);
        }

        .btn-update {
            padding: 1rem 2rem;
            background: var(--primary-gold);
            color: var(--dark-navy);
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .btn-update:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem;
            text-align: right;
            border-bottom: 1px solid var(--glass-border);
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            color: var(--primary-gold);
            font-weight: 600;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .badge {
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }

        .badge-pending {
            background: rgba(255, 193, 7, 0.2);
            color: #fbbf24;
        }

        .badge-paid {
            background: rgba(40, 167, 69, 0.2);
            color: #4ade80;
        }

        .badge-cancelled {
            background: rgba(220, 53, 69, 0.2);
            color: #f87171;
        }

        .alert {
            padding: 1rem;
            border-radius: 15px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert.success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid rgba(40, 167, 69, 0.5);
            color: #4ade80;
        }

        .alert.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .section {
                padding: 2rem;
            }

            table {
                font-size: 0.9rem;
            }

            th, td {
                padding: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                <span>العودة</span>
            </a>
        </div>

        <h1 data-i18n="admin_title">لوحة الإدارة</h1>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-calendar-check"></i>
                </div>
                <div class="stat-value" id="totalBookings">0</div>
                <div class="stat-label">إجمالي الحجوزات</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="stat-value" id="pendingBookings">0</div>
                <div class="stat-label">قيد الانتظار</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-value" id="paidBookings">0</div>
                <div class="stat-label">مدفوعة</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-coins"></i>
                </div>
                <div class="stat-value" id="totalRevenue">0 DZD</div>
                <div class="stat-label">الإيرادات</div>
            </div>
        </div>

        <!-- Price Settings -->
        <div class="section">
            <h2 data-i18n="admin_settings">إعدادات الأسعار</h2>
            <div id="alertBox" class="alert"></div>

            <div class="price-settings">
                <div class="price-group">
                    <h3 data-i18n="room_studio">ستوديو</h3>
                    <div class="input-group">
                        <input type="number" id="studioPrice" min="0" step="100">
                        <span>DZD</span>
                    </div>
                </div>

                <div class="price-group">
                    <h3 data-i18n="room_onebedroom">غرفة نوم واحدة</h3>
                    <div class="input-group">
                        <input type="number" id="oneBedroomPrice" min="0" step="100">
                        <span>DZD</span>
                    </div>
                </div>

                <div class="price-group">
                    <h3 data-i18n="room_family">عائلية</h3>
                    <div class="input-group">
                        <input type="number" id="familyPrice" min="0" step="100">
                        <span>DZD</span>
                    </div>
                </div>
            </div>

            <button class="btn-update" onclick="updatePrices()" style="margin-top: 2rem;">
                <i class="fas fa-save"></i>
                <span data-i18n="admin_update">تحديث الأسعار</span>
            </button>
        </div>

        <!-- All Bookings -->
        <div class="section">
            <h2 data-i18n="admin_bookings">جميع الحجوزات</h2>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>الاسم</th>
                            <th>البريد</th>
                            <th>الهاتف</th>
                            <th>الغرفة</th>
                            <th>الدخول</th>
                            <th>الخروج</th>
                            <th>الضيوف</th>
                            <th>المبلغ</th>
                            <th>الحالة</th>
                            <th>التاريخ</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsTable">
                        <!-- Bookings will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="translations.js"></script>
    <script src="supabase.js"></script>
    
    <script>
        let currentUser = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            // Check authentication and admin status
            currentUser = await ResidenceZiani.Auth.getCurrentUser();
            
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            const isAdmin = await ResidenceZiani.Utils.isAdmin(currentUser.email);
            if (!isAdmin) {
                alert('غير مصرح لك بالدخول إلى هذه الصفحة');
                window.location.href = 'index.html';
                return;
            }

            // Load data
            await loadPrices();
            await loadBookings();
            calculateStats();
        });

        async function loadPrices() {
            const prices = await ResidenceZiani.RoomSettings.getPrices();
            if (prices) {
                document.getElementById('studioPrice').value = prices.studio_price;
                document.getElementById('oneBedroomPrice').value = prices.one_bedroom_price;
                document.getElementById('familyPrice').value = prices.family_price;
            }
        }

        async function updatePrices() {
            const studioPrice = parseInt(document.getElementById('studioPrice').value);
            const oneBedroomPrice = parseInt(document.getElementById('oneBedroomPrice').value);
            const familyPrice = parseInt(document.getElementById('familyPrice').value);

            // Update all prices
            await ResidenceZiani.RoomSettings.updatePrice('studio_price', studioPrice);
            await ResidenceZiani.RoomSettings.updatePrice('one_bedroom_price', oneBedroomPrice);
            await ResidenceZiani.RoomSettings.updatePrice('family_price', familyPrice);

            showAlert('success', 'تم تحديث الأسعار بنجاح');
        }

        async function loadBookings() {
            const bookings = await ResidenceZiani.Bookings.getAllBookings();
            const tbody = document.getElementById('bookingsTable');

            if (bookings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;">لا توجد حجوزات</td></tr>';
                return;
            }

            tbody.innerHTML = bookings.map(booking => {
                const statusClass = `badge-${booking.payment_status}`;
                const statusText = langManager.t(`status_${booking.payment_status}`);
                
                return `
                    <tr>
                        <td>${booking.id}</td>
                        <td>${booking.full_name}</td>
                        <td>${booking.email}</td>
                        <td>${booking.phone}</td>
                        <td>${getRoomName(booking.room_type)}</td>
                        <td>${formatDate(booking.check_in)}</td>
                        <td>${formatDate(booking.check_out)}</td>
                        <td>${booking.guests}</td>
                        <td>${booking.total_price.toLocaleString('fr-DZ')}</td>
                        <td><span class="badge ${statusClass}">${statusText}</span></td>
                        <td>${formatDateTime(booking.created_at)}</td>
                    </tr>
                `;
            }).join('');

            // Calculate stats
            calculateStats(bookings);
        }

        function calculateStats(bookings = []) {
            const total = bookings.length;
            const pending = bookings.filter(b => b.payment_status === 'pending').length;
            const paid = bookings.filter(b => b.payment_status === 'paid').length;
            const revenue = bookings
                .filter(b => b.payment_status === 'paid')
                .reduce((sum, b) => sum + b.total_price, 0);

            document.getElementById('totalBookings').textContent = total;
            document.getElementById('pendingBookings').textContent = pending;
            document.getElementById('paidBookings').textContent = paid;
            document.getElementById('totalRevenue').textContent = revenue.toLocaleString('fr-DZ') + ' DZD';
        }

        function getRoomName(roomType) {
            const typeMap = {
                'studio': langManager.t('room_studio'),
                'one_bedroom': langManager.t('room_onebedroom'),
                'family': langManager.t('room_family')
            };
            return typeMap[roomType] || roomType;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('ar-DZ', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }

        function formatDateTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('ar-DZ', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function showAlert(type, message) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert ${type} show`;
            alertBox.textContent = message;

            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 5000);
        }
    </script>
</body>
</html>
