<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Résidence Ziani</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sea: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                        sand: {
                            50: '#fdf8f0',
                            100: '#faf3e0',
                            200: '#f5e6c8',
                            300: '#edd9a8',
                            400: '#e5c987',
                            500: '#ddb966',
                            600: '#d4a341',
                        }
                    },
                    fontFamily: {
                        arabic: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
        .auth-gradient {
            background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
        }
        .input-field {
            transition: all 0.3s ease;
        }
        .input-field:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }
    </style>
</head>
<body class="font-arabic bg-sea-50 min-h-screen flex items-center justify-center p-4">

    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-80 h-80 bg-sand-300/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-sea-300/20 rounded-full blur-3xl"></div>
    </div>

    <div class="relative w-full max-w-md">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-3 mb-4">
                <div class="w-14 h-14 bg-gradient-to-br from-sea-500 to-sea-700 rounded-full flex items-center justify-center shadow-lg">
                    <i class="fas fa-home text-white text-2xl"></i>
                </div>
                <div class="text-right">
                    <h1 class="text-2xl font-bold text-sea-800">Résidence Ziani</h1>
                    <p class="text-sm text-sea-600">إقامة زياني</p>
                </div>
            </a>
            <h2 class="text-2xl font-bold text-sea-800">تسجيل الدخول</h2>
            <p class="text-sea-600 mt-2">مرحباً بعودتك! يرجى إدخال بياناتك</p>
        </div>

        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-sea-800 mb-2">
                        <i class="fas fa-envelope ml-2 text-sea-500"></i>
                        البريد الإلكتروني
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="example@email.com"
                        class="input-field w-full px-4 py-3 border border-sea-200 rounded-xl focus:outline-none text-sea-800 placeholder-sea-400"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-sea-800 mb-2">
                        <i class="fas fa-lock ml-2 text-sea-500"></i>
                        كلمة المرور
                    </label>
                    <div class="relative">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            placeholder="••••••••"
                            class="input-field w-full px-4 py-3 border border-sea-200 rounded-xl focus:outline-none text-sea-800 placeholder-sea-400"
                        >
                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute left-3 top-1/2 -translate-y-1/2 text-sea-400 hover:text-sea-600 transition"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input
                            type="checkbox"
                            id="remember"
                            class="w-4 h-4 text-sea-500 border-sea-300 rounded focus:ring-sea-500"
                        >
                        <span class="text-sm text-sea-600">تذكرني</span>
                    </label>
                    <a href="#" class="text-sm text-sea-500 hover:text-sea-700 transition font-medium">
                        هل نسيت كلمة المرور؟
                    </a>
                </div>

                <button
                    type="submit"
                    class="w-full bg-gradient-to-r from-sea-500 to-sea-600 text-white py-3 rounded-xl font-bold text-lg hover:from-sea-600 hover:to-sea-700 transition shadow-lg transform hover:scale-[1.02]"
                >
                    <i class="fas fa-sign-in-alt ml-2"></i>
                    تسجيل الدخول
                </button>
            </form>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-sea-200"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-white text-sea-400">أو</span>
                </div>
            </div>

            <div class="space-y-3">
                <button class="w-full flex items-center justify-center gap-3 px-4 py-3 border-2 border-sea-200 rounded-xl hover:bg-sea-50 transition font-medium text-sea-700">
                    <i class="fab fa-google text-red-500"></i>
                    الدخول عبر Google
                </button>
                <button class="w-full flex items-center justify-center gap-3 px-4 py-3 border-2 border-sea-200 rounded-xl hover:bg-sea-50 transition font-medium text-sea-700">
                    <i class="fab fa-facebook text-blue-600"></i>
                    الدخول عبر Facebook
                </button>
            </div>

            <p class="text-center mt-6 text-sea-600">
                ليس لديك حساب؟
                <a href="register.html" class="text-sea-500 hover:text-sea-700 font-bold transition">
                    إنشاء حساب جديد
                </a>
            </p>
        </div>

        <div class="text-center mt-6">
            <a href="index.html" class="text-sea-600 hover:text-sea-800 transition text-sm">
                <i class="fas fa-arrow-right ml-2"></i>
                العودة للصفحة الرئيسية
            </a>
        </div>
    </div>

    <script>
        // Toggle Password Visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.querySelector('i').classList.toggle('fa-eye');
            togglePassword.querySelector('i').classList.toggle('fa-eye-slash');
        });

        // Form Submission (Ready for Supabase)
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            console.log('Login attempt:', { email, remember });

            // TODO: Connect to Supabase Auth
            // const { data, error } = await supabase.auth.signInWithPassword({
            //     email,
            //     password
            // });

            alert('سيتم ربط هذا النموذج مع Supabase قريباً!');
        });
    </script>
</body>
</html>
