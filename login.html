<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Résidence Ziani</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gold: #D4AF37;
            --dark-navy: #0A192F;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0A192F 0%, #1A3A52 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: white;
            text-decoration: none;
            margin-bottom: 2rem;
            padding: 0.8rem 1.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo i {
            font-size: 4rem;
            color: var(--primary-gold);
            margin-bottom: 1rem;
        }

        .logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--primary-gold);
        }

        h2 {
            text-align: center;
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }

        input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-gold);
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 1.2rem;
            background: var(--primary-gold);
            color: var(--dark-navy);
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .divider {
            text-align: center;
            margin: 2rem 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: var(--glass-border);
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn-social {
            width: 100%;
            padding: 1rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }

        .btn-social:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .btn-social i {
            font-size: 1.2rem;
        }

        .btn-google {
            border-color: #EA4335;
        }

        .btn-google:hover {
            background: rgba(234, 67, 53, 0.2);
        }

        .btn-facebook {
            border-color: #1877F2;
        }

        .btn-facebook:hover {
            background: rgba(24, 119, 242, 0.2);
        }

        .register-link {
            text-align: center;
            margin-top: 2rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .register-link a {
            color: var(--primary-gold);
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 1rem;
            border-radius: 15px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert.success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid rgba(40, 167, 69, 0.5);
            color: #4ade80;
        }

        .alert.error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.5);
            color: #f87171;
        }

        .alert.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .login-card {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            <span data-i18n="nav_home">الرئيسية</span>
        </a>

        <div class="login-card">
            <div class="logo">
                <i class="fas fa-hotel"></i>
                <h1>RÉSIDENCE ZIANI</h1>
            </div>

            <h2 data-i18n="login_title">تسجيل الدخول</h2>

            <div id="alertBox" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label data-i18n="login_email">البريد الإلكتروني</label>
                    <input type="email" id="email" required data-i18n-placeholder="login_email">
                </div>

                <div class="form-group">
                    <label data-i18n="login_password">كلمة المرور</label>
                    <input type="password" id="password" required data-i18n-placeholder="login_password">
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    <span data-i18n="login_submit">دخول</span>
                </button>
            </form>

            <div class="divider">أو</div>

            <div class="social-buttons">
                <button class="btn-social btn-google" onclick="loginWithGoogle()">
                    <i class="fab fa-google"></i>
                    <span data-i18n="login_google">تسجيل الدخول بجوجل</span>
                </button>

                <button class="btn-social btn-facebook" onclick="loginWithFacebook()">
                    <i class="fab fa-facebook-f"></i>
                    <span data-i18n="login_facebook">تسجيل الدخول بفيسبوك</span>
                </button>
            </div>

            <div class="register-link">
                <span data-i18n="login_noaccount">ليس لديك حساب؟</span>
                <a href="register.html" data-i18n="login_register">سجل الآن</a>
            </div>
        </div>
    </div>

    <script src="translations.js"></script>
    <script src="supabase.js"></script>
    
    <script>
        // Check if already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await ResidenceZiani.Auth.getCurrentUser();
            if (user) {
                window.location.href = 'profile.html';
            }
        });

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحميل...';

            const result = await ResidenceZiani.Auth.signIn(email, password);

            if (result.success) {
                showAlert('success', langManager.t('msg_login_success'));
                setTimeout(() => {
                    window.location.href = 'profile.html';
                }, 1000);
            } else {
                showAlert('error', result.error || langManager.t('msg_error'));
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span data-i18n="login_submit">دخول</span>';
            }
        });

        // Google login
        async function loginWithGoogle() {
            const result = await ResidenceZiani.Auth.signInWithGoogle();
            if (!result.success) {
                showAlert('error', result.error || langManager.t('msg_error'));
            }
        }

        // Facebook login
        async function loginWithFacebook() {
            const result = await ResidenceZiani.Auth.signInWithFacebook();
            if (!result.success) {
                showAlert('error', result.error || langManager.t('msg_error'));
            }
        }

        function showAlert(type, message) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert ${type} show`;
            alertBox.textContent = message;

            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 5000);
        }
    </script>
</body>
</html>
